name: MTI CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type-Check
        run: npm run type-check

  build-and-test:
    name: Build & Verify
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        env:
          NODE_ENV: production
          DATABASE_URI: postgres://postgres:postgres@localhost:5432/mti_test
          PAYLOAD_SECRET: ci-temporary-payload-secret-key-16-chars
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        run: npm run build

      - name: Build Docker Image
        run: docker build -t mti-web:ci .
